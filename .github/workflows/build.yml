name: Android Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee -a gradle.log

      - name: Build debug and release APKs
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease 2>&1 | tee -a gradle.log

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew lintDebug 2>&1 | tee -a gradle.log

      # Surfaces Gradle's error summary as an annotation on the run page.
      - name: Report Gradle failure
        if: failure()
        run: |
          summary=$( (grep -A 25 'What went wrong' gradle.log; grep -E '^(e:|ERROR:|.*error:)' gradle.log) | head -60 \
            | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle failure::${summary:-see log}"

      - name: APK sizes
        run: ls -l build/outputs/apk/debug/*.apk build/outputs/apk/release/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: slide-debug-apk
          path: build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: slide-release-unsigned-apk
          path: build/outputs/apk/release/*.apk

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/
            build/test-results/
