buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}
apply plugin: 'com.android.application'

android {
    namespace 'trikita.slide'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        versionCode 4
        versionName "1.3"
        minSdkVersion 21
        targetSdkVersion 35
    }

    signingConfigs {
        release
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFile getDefaultProguardFile('proguard-android.txt')
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':jedux')
    implementation project(':promote')

    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'co.trikita:anvil-sdk19:0.3.1'

    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation 'org.immutables:gson:2.1.14'
    annotationProcessor 'org.immutables:value:2.1.14'
    compileOnly 'org.immutables:value:2.1.14'
}

apply from: 'signing.gradle'
