buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}
apply plugin: 'com.android.application'

android {
    namespace 'trikita.slide'
    compileSdk 36

    defaultConfig {
        versionCode 5
        versionName "1.4"
        minSdkVersion 21
        targetSdkVersion 36
    }

    signingConfigs {
        // A fixed debug key, so debug APKs from CI install as updates of each
        // other. Debug keys are not secret; the release key never lives here.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            // Shows up in Settings > Apps > Slide, so testers can tell which CI build is installed.
            versionNameSuffix "-" + (System.getenv("GITHUB_SHA")?.take(7) ?: "dev")
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':jedux')

    implementation 'com.github.bumptech.glide:glide:4.16.0'

    testImplementation 'junit:junit:4.13.2'
}

apply from: 'signing.gradle'
