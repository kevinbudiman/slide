buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}
apply plugin: 'com.android.application'

android {
    namespace 'trikita.slide'
    compileSdk 36

    defaultConfig {
        versionCode 5
        versionName "1.4"
        minSdkVersion 21
        targetSdkVersion 36
    }

    signingConfigs {
        release
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':jedux')

    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'co.trikita:anvil-sdk19:0.3.1'

    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation 'org.immutables:gson:2.1.14'
    annotationProcessor 'org.immutables:value:2.1.14'
    compileOnly 'org.immutables:value:2.1.14'
}

apply from: 'signing.gradle'
