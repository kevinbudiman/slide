// Vendored from https://github.com/trikita/promote at commit de169a5 (MIT, see LICENSE).
apply plugin: 'com.android.library'

android {
    namespace 'trikita.promote'
    compileSdk 36

    defaultConfig {
        minSdkVersion 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
